aid: viaphoton
name: viaPhoton
description: >-
  viaPhoton is a Naperville, Illinois fiber optic connectivity manufacturer, founded in 2020, that
  designs and builds high-density fiber solutions for hyperscale and enterprise data centers, 5G
  and broadband access networks, and AI network fabrics. Its catalog spans inside-plant products
  (fiber trunks, fiber arrays, patch cords, MPO/MTP connectivity, structured cabling) and
  outside-plant products (outdoor fiber jumpers, fiber drop cables, outdoor trunks), produced in a
  domestic "micro-factory" model intended to shorten lead times against an industry that sources
  roughly 90% of fiber optic material offshore. viaPhoton sells through a configure-price-quote
  product configurator rather than a developer program; it publishes no public API, SDK, developer
  portal, or machine-readable API contract.
